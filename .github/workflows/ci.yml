name: Home Net Controller CI (Windows Only)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-windows:
    name: Test Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Home Net Controller in editable mode with test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Pytest test suite (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -v

      - name: Test CLI smoke check
        run: |
          python main.py --help
          python main.py diagnostics
          hnc --help
          hnc diagnostics
