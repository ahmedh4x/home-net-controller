name: Home Net Controller CI Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Home Net Controller in editable mode with test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run headless Pytest test suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -m pytest -v

      - name: Run Pytest test suite (Windows & macOS)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -v

      - name: Test CLI smoke check
        run: |
          python main.py --help
          python main.py diagnostics
          hnc --help
          hnc diagnostics
